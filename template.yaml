AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Ground Truth - hourly trust checks for Delhi's air-quality monitors.

Parameters:
  OpenAQKeyParam:
    Type: String
    Default: /ground-truth/openaq-key
    Description: SSM SecureString holding the OpenAQ API key (created by hand, see issue 1).

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Ground Truth site
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_200
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # Managed policy "CachingOptimized"; it honours the objects' Cache-Control (data/*.json: 5 min)
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Sid: CloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Hourly - OpenAQ readings -> scorer -> data/*.json
      CodeUri: src/
      Handler: ingest.handler
      Runtime: python3.11
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 900  # ~260 paced API calls at under 60/min, plus the nightly archive pass (at most 90 s)
      ReservedConcurrentExecutions: 1  # never two runs writing the cache at once
      Environment:
        Variables:
          SITE_BUCKET: !Ref SiteBucket
          OPENAQ_KEY_PARAM: !Ref OpenAQKeyParam
          MAX_CALLS: "300"
      Events:
        Hourly:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
      Policies:
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${OpenAQKeyParam}"
            - Effect: Allow
              Action: [s3:GetObject, s3:PutObject]
              Resource: !Sub "${SiteBucket.Arn}/data/*"
            - Effect: Allow
              Action: s3:ListBucket  # so a missing key reads as NoSuchKey, not AccessDenied
              Resource: !GetAtt SiteBucket.Arn

  IngestLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${IngestFunction}"
      RetentionInDays: 14

Outputs:
  SiteUrl:
    Value: !Sub "https://${SiteDistribution.DomainName}"
  SiteBucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref SiteDistribution
  IngestFunctionName:
    Value: !Ref IngestFunction
