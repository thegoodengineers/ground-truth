AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Ground Truth - hourly trust checks for Delhi's air-quality monitors.

Parameters:
  OpenAQKeyParam:
    Type: String
    Default: /ground-truth/openaq-key
    Description: SSM SecureString holding the OpenAQ API key (created by hand, see issue 1).
  FirmsKeyParam:
    Type: String
    Default: /ground-truth/firms-key
    Description: SSM SecureString holding a NASA FIRMS map key (optional; the farm-fire layer is skipped without it).
  AlertEmail:
    Type: String
    Default: ""
    Description: Where the alarms and the budget warning go. Empty disables the email subscription.

  UseCloudFront:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Put CloudFront in front of the bucket. Off by default: new accounts can't create distributions until AWS
      Support verifies them (issue 2). Off, the site is served over HTTPS by a Lambda function URL and over HTTP
      by the S3 website endpoint; the bucket is then public-read.

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  UseCloudFront: !Equals [!Ref UseCloudFront, "true"]
  NoCloudFront: !Not [!Equals [!Ref UseCloudFront, "true"]]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Private behind CloudFront; public-read (objects only, never ACLs) when served as a website.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: !If [UseCloudFront, true, false]
        IgnorePublicAcls: true
        RestrictPublicBuckets: !If [UseCloudFront, true, false]
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: UseCloudFront
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: UseCloudFront
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Ground Truth site
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_200
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # Managed policy "CachingOptimized"; it honours the objects' Cache-Control (data/*.json: 5 min)
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SiteHeaders

  # Security headers on every response (issue 35). Everything the site needs is on its own origin
  # (three.js and Chart.js are vendored); only the fonts come from Google Fonts. src/serve.py sends the same
  # headers when the site is served by the function URL; tests/test_serve.py keeps the two in step.
  SiteHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Condition: UseCloudFront
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security-headers"
        Comment: CSP, HSTS, nosniff, referrer policy and no framing for the Ground Truth site
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: >-
              default-src 'self';
              script-src 'self';
              style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
              font-src 'self' https://fonts.gstatic.com;
              img-src 'self' data: blob:;
              connect-src 'self';
              worker-src 'self' blob:;
              object-src 'none';
              base-uri 'self';
              form-action 'self';
              frame-ancestors 'none';
              upgrade-insecure-requests
          StrictTransportSecurity:
            Override: true
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: true
          ContentTypeOptions:
            Override: true
          ReferrerPolicy:
            Override: true
            ReferrerPolicy: strict-origin-when-cross-origin
          FrameOptions:
            Override: true
            FrameOption: DENY
          XSSProtection:
            Override: true
            Protection: true
            ModeBlock: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Override: true
              Value: camera=(), microphone=(), geolocation=(self), payment=(), usb=()

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - !If
            - UseCloudFront
            - Sid: CloudFrontReadOnly
              Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:GetObject
              Resource: !Sub "${SiteBucket.Arn}/*"
              Condition:
                StringEquals:
                  AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"
            - Sid: PublicWebsiteRead
              Effect: Allow
              Principal: "*"
              Action: s3:GetObject
              Resource: !Sub "${SiteBucket.Arn}/*"

  # HTTPS without CloudFront: a function URL that reads the bucket and adds the security headers.
  ServeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Serves the site from the bucket over HTTPS with security headers (CloudFront stand-in)
      CodeUri: src/
      Handler: serve.handler
      Runtime: python3.11
      Architectures: [arm64]
      MemorySize: 512  # more CPU too: gzip and S3 reads finish sooner, so fewer copies run at once
      Timeout: 10
      Environment:
        Variables:
          SITE_BUCKET: !Ref SiteBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${SiteBucket.Arn}/*"
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt SiteBucket.Arn

  ServeFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ServeFunction.Arn
      AuthType: NONE

  ServeFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ServeFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  # Since 2025 a public function URL also needs InvokeFunction with the InvokedViaFunctionUrl condition
  # (without it every request is 403). cfn-lint's schema doesn't know the property yet, hence the ignore.
  ServeFunctionUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [E3002]
    Properties:
      FunctionName: !Ref ServeFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  ServeLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ServeFunction}"
      RetentionInDays: 14

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Hourly - OpenAQ readings -> scorer -> data/*.json
      CodeUri: src/
      Handler: ingest.handler
      Runtime: python3.11
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 900  # ~260 paced API calls at under 60/min, plus the nightly archive pass (at most 90 s)
      # No reserved concurrency: a new account's limit (10) can't spare it. Runs can't overlap anyway: one an hour,
      # each at most 15 minutes, and a rerun inside the same hour is counted once by the status smoothing.
      Environment:
        Variables:
          SITE_BUCKET: !Ref SiteBucket
          OPENAQ_KEY_PARAM: !Ref OpenAQKeyParam
          MAX_CALLS: "300"
          METRIC_NAMESPACE: GroundTruth
          STACK_NAME: !Ref AWS::StackName
          REGION: delhi  # src/regions/<name>.json: the monitors, the neighbour radius, the map
          SITE_URL: !If [UseCloudFront, !Sub "https://${SiteDistribution.DomainName}/", !GetAtt ServeFunctionUrl.FunctionUrl]  # for the feed's links
          FIRMS_KEY_PARAM: !Ref FirmsKeyParam
      Events:
        Hourly:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
      Policies:
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${OpenAQKeyParam}"
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${FirmsKeyParam}"
            - Effect: Allow
              Action: [s3:GetObject, s3:PutObject]
              Resource: !Sub "${SiteBucket.Arn}/data/*"
            - Effect: Allow
              Action: s3:ListBucket  # so a missing key reads as NoSuchKey, not AccessDenied
              Resource: !GetAtt SiteBucket.Arn
            - Effect: Allow
              Action: cloudwatch:PutMetricData  # one DataAgeHours + one IngestErrors point per run
              Resource: "*"
              Condition:
                StringEquals:
                  cloudwatch:namespace: GroundTruth

  IngestLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${IngestFunction}"
      RetentionInDays: 14

  # Know when the hourly run breaks (issue 23): an SNS topic with the team email, and three alarms.
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-alerts"
      DisplayName: Ground Truth alerts

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  IngestErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-lambda-errors"
      AlarmDescription: The ingest Lambda failed in 2 consecutive hours. Read the last log line, then `make run`.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref IngestFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  IngestRunErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-ingest-run-error"
      AlarmDescription: Two runs in a row stopped early (wrong OpenAQ key, or the API unreachable). Check the SSM key, then `make run`.
      Namespace: GroundTruth
      MetricName: IngestErrors
      Dimensions:
        - Name: Stack
          Value: !Ref AWS::StackName
      Statistic: Maximum
      Period: 3600
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  StaleDataAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-stale-data"
      AlarmDescription: data_through is more than 3 hours old (or the Lambda stopped running). See docs/RUNBOOK.md.
      Namespace: GroundTruth
      MetricName: DataAgeHours
      Dimensions:
        - Name: Stack
          Value: !Ref AWS::StackName
      Statistic: Maximum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: breaching  # no run at all for an hour is as bad as stale data
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  # One screen for the whole system: how fresh the data is, whether the hourly run is healthy, how busy the site's
  # HTTPS function is (and whether it is being throttled), and the three alarms.
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AWS::StackName}"
      DashboardBody: !Sub |
        {"widgets": [
          {"type": "text", "x": 0, "y": 0, "width": 24, "height": 2, "properties": {"markdown": "# Ground Truth, live · Every hour EventBridge runs the ingest Lambda: OpenAQ readings, three checks, data/*.json in S3, served over HTTPS by a second Lambda. Alarms email through SNS."}},
          {"type": "metric", "x": 0, "y": 2, "width": 8, "height": 6, "properties": {"title": "Hours since the newest scored hour",
            "region": "${AWS::Region}", "view": "timeSeries", "stat": "Maximum", "period": 3600,
            "metrics": [["GroundTruth", "DataAgeHours", "Stack", "${AWS::StackName}"]]}},
          {"type": "metric", "x": 8, "y": 2, "width": 8, "height": 6, "properties": {"title": "Hourly run: invocations and errors",
            "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 3600,
            "metrics": [["AWS/Lambda", "Invocations", "FunctionName", "${IngestFunction}"],
                        [".", "Errors", ".", "."],
                        ["GroundTruth", "IngestErrors", "Stack", "${AWS::StackName}", {"label": "Runs stopped early"}]]}},
          {"type": "metric", "x": 16, "y": 2, "width": 8, "height": 6, "properties": {"title": "Hourly run: duration (ms)",
            "region": "${AWS::Region}", "view": "timeSeries", "stat": "Maximum", "period": 3600,
            "metrics": [["AWS/Lambda", "Duration", "FunctionName", "${IngestFunction}"]]}},
          {"type": "metric", "x": 0, "y": 8, "width": 12, "height": 6, "properties": {"title": "The city's answers, each hour (monitors)",
            "region": "${AWS::Region}", "view": "timeSeries", "stacked": true, "stat": "Maximum", "period": 3600,
            "metrics": [["GroundTruth", "Monitors_flag", "Stack", "${AWS::StackName}", {"label": "Doesn't add up", "color": "#d03b3b"}],
                        [".", "Monitors_watch", ".", ".", {"label": "Worth a look", "color": "#f2a60c"}],
                        [".", "Monitors_ok", ".", ".", {"label": "Agrees with neighbours", "color": "#0ca30c"}],
                        [".", "Monitors_nodata", ".", ".", {"label": "Not enough data", "color": "#a3a4a9"}]]}},
          {"type": "log", "x": 12, "y": 8, "width": 12, "height": 6, "properties": {"title": "The last 24 hourly runs",
            "region": "${AWS::Region}", "view": "table",
            "query": "SOURCE '/aws/lambda/${IngestFunction}' | filter ispresent(new_hours) | fields @timestamp, new_hours, skipped, published, statuses.flag, statuses.watch, error | sort @timestamp desc | limit 24"}},
          {"type": "metric", "x": 0, "y": 14, "width": 12, "height": 6, "properties": {"title": "Site (HTTPS function): requests, throttles, errors",
            "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300,
            "metrics": [["AWS/Lambda", "Invocations", "FunctionName", "${ServeFunction}"],
                        [".", "Throttles", ".", "."],
                        [".", "Errors", ".", "."]]}},
          {"type": "metric", "x": 12, "y": 14, "width": 12, "height": 6, "properties": {"title": "Site: concurrent copies, and duration p90 (ms)",
            "region": "${AWS::Region}", "view": "timeSeries", "period": 300,
            "metrics": [["AWS/Lambda", "ConcurrentExecutions", "FunctionName", "${ServeFunction}", {"stat": "Maximum"}],
                        [".", "Duration", ".", ".", {"stat": "p90", "yAxis": "right"}]]}},
          {"type": "alarm", "x": 0, "y": 20, "width": 24, "height": 3, "properties": {"title": "Alarms",
            "alarms": ["${IngestErrorsAlarm.Arn}", "${IngestRunErrorAlarm.Arn}", "${StaleDataAlarm.Arn}"]}}
        ]}

  # What it costs to run (issue 36): $5 a month, an email at 80%, scoped to the project tag.
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasAlertEmail
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 5
          Unit: USD
        CostFilters:
          TagKeyValue:
            - user:project$ground-truth
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

Outputs:
  DashboardUrl:
    Description: The CloudWatch dashboard for the whole system
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/${AWS::StackName}"
  AlertTopicArn:
    Value: !Ref AlertTopic
  SiteUrl:
    Description: The HTTPS site (CloudFront when enabled, else the function URL)
    Value: !If [UseCloudFront, !Sub "https://${SiteDistribution.DomainName}", !GetAtt ServeFunctionUrl.FunctionUrl]
  SiteWebsiteUrl:
    Description: The S3 website endpoint (HTTP), the fallback while CloudFront is unavailable
    Value: !If [NoCloudFront, !GetAtt SiteBucket.WebsiteURL, ""]
  SiteBucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !If [UseCloudFront, !Ref SiteDistribution, ""]
  IngestFunctionName:
    Value: !Ref IngestFunction
